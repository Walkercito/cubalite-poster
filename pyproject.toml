[project]
name = "cubalite-poster"
version = "0.1.0"
description = "Automatic poster image generator with a fixed news-channel design"
readme = "README.md"
authors = [
    { name = "Walkercito", email = "yoanky2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dearpygui>=2.0",
    "pillow>=12.3.0",
]

[project.scripts]
cubalite-poster = "cubalite_poster:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.57",
    "pytest>=8.0",
]

[tool.uv]
# Managed CPython is fine on every OS; DearPyGUI ships its own binaries.
python-preference = "managed"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
