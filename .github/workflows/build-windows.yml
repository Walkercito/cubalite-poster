# Build CubalitePoster for Windows and publish to GitHub Releases.
#
# Triggers:
#   - push to main     → updates the "latest" pre-release (+ workflow artifact)
#   - tag v*           → creates a versioned release with the zip
#   - pull request     → test + build artifact only (no release)
#   - workflow_dispatch → same as main when run on main
#
# Download: repo → Releases → Latest build  (or a v* release)

name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Quality gate
        run: |
          uv run ruff check
          uv run ty check
          uv run pytest -q

      # A tagged release must match pyproject — the frozen app reports the
      # pyproject version, so a mismatch would confuse the auto-updater.
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$VERSION" != "$TAG_NAME" ]; then
            echo "Tag $TAG_NAME != pyproject v$VERSION"
            exit 1
          fi

  windows-exe:
    name: Windows exe
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build distribution
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CubalitePoster-windows
          path: dist/CubalitePoster.zip
          if-no-files-found: error
          retention-days: 30

      # Versioned release: git tag v0.1.0 && git push origin v0.1.0
      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CubalitePoster.zip
            dist/CubalitePoster.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Continuous build on main — always available under Releases → "Latest build"
      - name: Publish latest pre-release
        if: >
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          files: |
            dist/CubalitePoster.zip
            dist/CubalitePoster.zip.sha256
          fail_on_unmatched_files: true
          body: |
            Continuous Windows build from `main`.

            Unzip and run `CubalitePoster\CubalitePoster.exe`.
            Ship the whole folder, not only the `.exe`.

            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
